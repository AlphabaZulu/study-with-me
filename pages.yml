# Study-With-Me! — publish the website to GitHub Pages (NOT YET RUN ON GITHUB)
# Requires: Settings > Pages > Build and deployment > Source = "GitHub Actions".
# Publishes ONLY index.html, .nojekyll and the data folder. Tools, workflows
# and notes in the repository are never put on the public website.
name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Collect website files only
        run: |
          mkdir _site
          cp index.html _site/
          cp -r data _site/
          touch _site/.nojekyll
          test -f _site/index.html && test -f _site/data/news.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
